paths:
  /api/auth/register:
    post:
      summary: Register a new user & send verification OTP
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Anish Chand
                email:
                  type: string
                  format: email
                  example: anish@example.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                role:
                  type: string
                  enum: [buyer, seller, admin]
                  default: buyer
                  example: seller
      responses:
        '201':
          description: User registered successfully, verification email sent.
        '400':
          description: User already exists or validation error
        '500':
          description: Server Error

  /api/auth/login:
    post:
      summary: Authenticate user & issue JWT token/cookie
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: anish@example.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123
      responses:
        '200':
          description: Login successful
        '400':
          description: Invalid credentials or missing fields
        '403':
          description: Account blocked, unverified email, or pending seller approval
        '500':
          description: Server Error

  /api/auth/verify-email:
    post:
      summary: Verify user email using 6-digit OTP code
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: anish@example.com
                code:
                  type: string
                  example: '482910'
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid email, code, or already verified
        '500':
          description: Server Error

  /api/auth/forgot-password:
    post:
      summary: Generate secure password reset token & send email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: anish@example.com
      responses:
        '200':
          description: Reset link sent message (returns safely even if email doesn't exist for security)
        '400':
          description: Email field missing
        '500':
          description: Server Error or email service failure

  /api/auth/reset-password/{token}:
    post:
      summary: Reset password using the hex token from URL
      tags:
        - Auth
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: 32-byte hex password reset token from email link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
                  example: NewSecurePassword456
      responses:
        '200':
          description: Password has been reset successfully
        '400':
          description: Invalid or expired reset token / missing fields
        '500':
          description: Server Error

  /api/auth/logout:
    post:
      summary: Log user out & clear JWT cookie
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
        '500':
          description: Server Error